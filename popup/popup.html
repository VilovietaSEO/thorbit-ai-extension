<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant Tasks</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <h1>Tasks</h1>
      <button type="button" id="open-panel-btn" class="icon-btn" title="Open Side Panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
      </button>
    </header>

    <main class="popup-content">
      <!-- Quick Add -->
      <div class="quick-add">
        <input
          type="text"
          id="new-task-input"
          placeholder="Add a task..."
          maxlength="200"
          autocomplete="off"
        >
        <button type="button" id="add-task-btn" class="icon-btn primary" title="Add Task">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>

      <!-- Task List -->
      <div id="task-list" class="task-list">
        <!-- Tasks rendered here by JS -->
      </div>

      <!-- Empty State -->
      <div id="empty-state" class="empty-state" hidden>
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
        </svg>
        <p>No tasks yet</p>
        <span>Add a task above or use the side panel for AI assistance</span>
      </div>
    </main>

    <footer class="popup-footer">
      <span id="task-count">0 tasks</span>
      <button type="button" id="clear-completed-btn" class="text-btn" disabled>Clear completed</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
