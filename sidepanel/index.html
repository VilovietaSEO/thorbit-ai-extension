<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Page Assistant</title>
  <!-- Thorbit Design System -->
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/fonts.css">
  <!-- Component Styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="automation-panel.css">
  <link rel="stylesheet" href="devtools-panel.css">
</head>
<body>
  <div id="root"></div>

  <!-- Day 2: Developer Tools Panel (collapsible, rendered by devtools-panel.js) -->
  <div id="devtools-panel"></div>

  <!-- Automation Panel (rendered by JS but modal needs to be in DOM) -->
  <div id="approval-modal" class="approval-modal modal-hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <h3>Action Requires Approval</h3>
      <div class="approval-details">
        <p id="approval-action-desc"></p>
      </div>
      <div class="modal-actions">
        <button id="approve-action-btn" class="btn-primary">Approve</button>
        <button id="deny-action-btn" class="btn-secondary">Deny</button>
      </div>
    </div>
  </div>

  <!--
    Note: For Chrome extensions with CSP 'script-src self', we cannot use CDN React.
    In production, bundle React with a build tool (webpack/vite/esbuild).
    For development, we use a simple vanilla JS approach that mimics React patterns.
  -->
  <script src="devtools-panel.js"></script>
  <script type="module" src="index.js"></script>
</body>
</html>
